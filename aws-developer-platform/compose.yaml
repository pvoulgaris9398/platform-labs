services:
  ministack:
    image: ministackorg/ministack:latest
    profiles: ["ministack"]
    ports:
      - "4566:4566"
    environment:
      GATEWAY_PORT: "4566"
      LOG_LEVEL: INFO
      MINISTACK_REGION: us-east-1
      PERSIST_STATE: "1"
      STATE_DIR: /tmp/ministack-state
      S3_PERSIST: "1"
      S3_DATA_DIR: /tmp/ministack-data/s3
      RDS_PERSIST: "1"
      LAMBDA_EXECUTOR: docker
      DOCKER_NETWORK: aws-developer-platform_default
    volumes:
      - ministack-state:/tmp/ministack-state
      - ministack-s3:/tmp/ministack-data/s3
      - //var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')
      interval: 10s
      timeout: 3s
      retries: 10
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://platform:local-development-only@db/platform
      SESSION_SECRET: local-development-only-change-me-32-bytes
      PROJECT_IAM_BACKEND: ministack
      MINISTACK_ENDPOINT: http://ministack:4566
      MINISTACK_ACCOUNT_ID: "000000000000"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  ministack-state:
  ministack-s3:
